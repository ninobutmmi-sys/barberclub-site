/* ═══════════════════════════════════════════
   VOIRON — le hub, comme Meylan et Grenoble (fond, logo, barre basse), avec
   ce que Voiron a en propre : ses visuels au bleu électrique, qui portent
   déjà le nom VOIRON — d'où l'absence de grand titre — et l'ouverture du
   21 octobre : un compte à rebours, puis l'offre -50 % jusqu'au 24.
   Accent : #3D5AFE (le bleu des visuels), texte bleuté #AFC0FF.
   ═══════════════════════════════════════════ */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
:root { --vo: #3D5AFE; --vo-glow: rgba(61,90,254,0.45); --vo-text: #AFC0FF; }
/* La photo ne sert plus que de repli : moins d'animations demandé, économie
   de données, ou vidéo que le navigateur refuse de lire. */
.bg {
  background-image: url('../../assets/images/salons/Voiron/voiron-fauteuil-billard.jpg?v=1');
  background-image: image-set(url('../../assets/images/salons/Voiron/voiron-fauteuil-billard.webp?v=1') type('image/webp'), url('../../assets/images/salons/Voiron/voiron-fauteuil-billard.jpg?v=1') type('image/jpeg'));
  background-position: 26% 50%;
  filter: brightness(0.82) saturate(1.05);
}
@media (min-width: 768px) { .bg { background-position: 50% 50%; } }

/* ── le teaser ──
   Il ouvre la page, seul à l'écran, puis reste figé sur sa dernière image :
   pas de changement de décor, l'interface se pose simplement dessus. */
.intro-wrap { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.intro { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.intro-glow, .replay-band { display: none; }
.page.no-video .intro-wrap, .page.no-video .intro-glow { display: none; }
/* Téléphone en portrait : une vidéo en paysage n'y montre qu'un quart de
   l'image, quel que soit le cadrage. Elle passe donc en entier, dans une
   bande de cinéma, et le reste de l'écran prend sa lumière : la vidéo,
   réduite à quelques pixels, étirée et floutée, image par image. */
@media (max-aspect-ratio: 1/1) {
  .intro-wrap {
    inset: auto 0 auto 0; top: calc(50% - 28.125vw); aspect-ratio: 16 / 9;
    transition: transform 1.1s cubic-bezier(0.16,1,0.3,1);
    box-shadow: 0 0 60px rgba(61,90,254,0.25), 0 30px 80px rgba(0,0,0,0.6);
  }
  .page.revealed .intro-wrap { transform: translateY(-12vh); }
  .intro-wrap::before, .intro-wrap::after {
    content: ''; position: absolute; left: 0; right: 0; height: 1px; z-index: 1;
    background: linear-gradient(90deg, transparent, rgba(61,90,254,0.9) 20%, #AFC0FF 50%, rgba(61,90,254,0.9) 80%, transparent);
    box-shadow: 0 0 12px rgba(61,90,254,0.9);
  }
  .intro-wrap::before { top: 0; } .intro-wrap::after { bottom: 0; }
  /* « Revoir » se pose sur le film : en bas de l'écran, le badge APP le couvrait */
  .open-foot .replay, .open-sep { display: none; }
  .replay-band {
    position: absolute; right: 10px; bottom: 10px; z-index: 2; pointer-events: auto;
    display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0;
    border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.45); color: #fff; cursor: pointer;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    opacity: 0; visibility: hidden; transition: opacity 0.5s ease 0.6s, visibility 0s;
  }
  .replay-band svg { width: 14px; height: 14px; margin-left: 2px; }
  .replay-band:focus-visible { outline: 2px solid var(--vo-text); outline-offset: 3px; }
  .page.teaser-done .replay-band { opacity: 1; visibility: visible; }
  .intro-glow {
    display: block; position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%;
    filter: blur(26px) brightness(0.5) saturate(1.35); transform: scale(1.25); pointer-events: none;
  }
}
.page:not(.no-video) .bg, .page:not(.no-video) .particles { display: none; }

.header, .hero, .bottom-nav, .bg-overlay { transition: opacity 0.9s ease 0.15s, visibility 0s; }
.page.is-teaser .header, .page.is-teaser .hero, .page.is-teaser .bottom-nav {

/* un chiffre = une colonne qui défile dans une fenêtre d'une ligne */

@media (max-height: 700px) {

@media (prefers-reduced-motion: reduce) {

}

<script>
/* Ouverture de Voiron : compte à rebours jusqu'au mercredi 21 octobre 2026,
   9h (heure de Paris, été : +02:00). Ensuite « Ouvert », et l'offre -50 %
   reste affichée jusqu'au samedi 24 au soir, puis disparaît. */
(() => {
  const OUVERTURE = Date.parse('2026-10-21T09:00:00+02:00');
  const FIN_OFFRE = Date.parse('2026-10-24T23:59:59+02:00');
  const block = document.getElementById('openBlock');
  const chip = document.getElementById('openChipText');
  const offer = document.getElementById('openOffer');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Rouleaux : la colonne descend de max à 0, plus un max final ; passer de
  // 0 à max défile jusqu'à ce max, puis revient en haut sans transition.
  const rolls = {};
  document.querySelectorAll('#countdown [data-roll]').forEach((el, i) => {
    const max = +el.dataset.max;
    el.className = 'roll';
    const col = document.createElement('span');
    col.className = 'roll-col';
    for (const k of [...Array(max + 1).keys()].reverse().concat(max)) {
      const c = document.createElement('span'); c.textContent = k; col.appendChild(c);
    }
    el.appendChild(col);
    rolls[el.dataset.roll] = { col, max, cur: null, ordre: i };
  });
  function poser(r, d, premier) {
    if (r.cur === d) return;
    const tour = r.cur === 0 && d === r.max;
    const idx = tour ? r.max + 1 : r.max - d;
    if (premier && !reduced) {
      // L'arrivée : chaque rouleau part de son max et tourne jusqu'à sa valeur
      r.col.style.transition = `transform ${1.2 + r.ordre * 0.12}s cubic-bezier(0.16,1,0.3,1) ${0.35 + r.ordre * 0.06}s`;
      setTimeout(() => { r.col.style.transition = ''; }, 2600);
    }
    r.col.style.transform = `translateY(${-idx}em)`;
    if (tour) setTimeout(() => {
      r.col.style.transition = 'none'; r.col.style.transform = 'translateY(0)';
      void r.col.offsetHeight; r.col.style.transition = '';
    }, 650);
    r.cur = d;
  }

  const texte = document.getElementById('cdTexte');
  let premier = true;

  function maj() {
    const now = Date.now();
    if (now >= FIN_OFFRE) { if (offer) { offer.remove(); document.querySelector('.open-sep')?.remove(); } document.querySelectorAll('[data-offre]').forEach(el => el.remove()); }
    if (now >= OUVERTURE) {
      block.classList.add('is-open');
      chip.textContent = 'Ouvert · 5 av. Léon et Joanny Tardy';
      return false;
    }
    const t = Math.floor((OUVERTURE - now) / 1000);
    const d = Math.min(99, Math.floor(t / 86400)), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    const v = { d1: Math.floor(d / 10), d0: d % 10, h1: Math.floor(h / 10), h0: h % 10, m1: Math.floor(m / 10), m0: m % 10, s1: Math.floor(s / 10), s0: s % 10 };
    for (const k in v) poser(rolls[k], v[k], premier);

    if (s === 0 || premier) texte.textContent = `${d} jours, ${h} heures et ${m} minutes avant l'ouverture`;
    premier = false;
    return true;
  }
  if (maj()) { const id = setInterval(() => { if (!maj()) clearInterval(id); }, 1000); }
  // Le compteur se découvre après le teaser : ses rouleaux repartent de leur
  // max à ce moment-là, sinon leur entrée se jouerait derrière la vidéo.
  document.addEventListener('voiron:revele', () => {
    for (const k in rolls) {
      const r = rolls[k];
      r.col.style.transition = 'none'; r.col.style.transform = 'translateY(0)'; r.cur = null;
    }
    void document.body.offsetHeight;
    premier = true; maj();
  });
})();

/* Le teaser, puis la scène fixe. Lancé à la main (pas d'autoplay dans le
   HTML) pour pouvoir y renoncer : moins d'animations demandé, économie de
   données, ou lecture refusée par le navigateur. */
(() => {
  const page = document.getElementById('page');
  const intro = document.getElementById('intro');
  const replay = document.getElementById('replay');
  const saveData = navigator.connection && navigator.connection.saveData;
  if (!intro) return;
  const skip = document.getElementById('skip');
  const bar = document.getElementById('teaserBar');
  const sansVideo = () => {
    page.classList.add('no-video');
    intro.pause(); replay.remove(); document.querySelector('.open-sep')?.remove();
    fin();
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || saveData) {
    page.classList.remove('is-teaser'); page.classList.add('revealed', 'no-video');
    intro.remove(); replay.remove(); skip.remove(); document.querySelector('.open-sep')?.remove(); return;
  }
  const fin = () => {
    if (!page.classList.contains('is-teaser')) return;
    page.classList.remove('is-teaser'); page.classList.add('teaser-done', 'revealed');
    document.dispatchEvent(new Event('voiron:revele'));
  };
  const jouer = () => {
    page.classList.remove('teaser-done', 'revealed');
    page.classList.add('is-teaser');
    intro.currentTime = 0;
    intro.playbackRate = 1;
    const p = intro.play();
    if (p && p.catch) p.catch(sansVideo);
  };
  intro.addEventListener('ended', fin);
  intro.addEventListener('error', sansVideo, true);

  // Le halo du portrait : l'image courante, réduite à 32×18, que le CSS
  // étire et floute. Peint seulement s'il est affiché.
  const glow = document.getElementById('introGlow');
  const gctx = glow.getContext('2d');
  const halo = () => {
    if (glow.offsetParent === null || intro.readyState < 2) return;
    try { gctx.drawImage(intro, 0, 0, glow.width, glow.height); } catch (e) { /* image pas encore prête */ }
  };
  function cadre() {
    halo();
    if (intro.duration) bar.style.transform = `scaleX(${(intro.currentTime / intro.duration).toFixed(4)})`;
    if (!intro.paused && !intro.ended) requestAnimationFrame(cadre);
  }
  intro.addEventListener('playing', () => requestAnimationFrame(cadre));
  ['loadeddata', 'seeked', 'ended'].forEach(ev => intro.addEventListener(ev, halo));
  addEventListener('resize', halo);
  replay.addEventListener('click', jouer);
  document.getElementById('replayBand').addEventListener('click', jouer);
  // « Passer » mène à la dernière image : par un saut si le serveur le permet,
  // sinon en accéléré, pour ne jamais rester figé sur une image du milieu.
  skip.addEventListener('click', () => {
    const fin_ = intro.duration ? intro.duration - 0.05 : 0;
    const sautPossible = fin_ && intro.seekable.length && intro.seekable.end(intro.seekable.length - 1) >= fin_;
    if (sautPossible) { intro.pause(); intro.currentTime = fin_; requestAnimationFrame(cadre); }
    else { intro.playbackRate = 16; }
    fin();
  });
  jouer();
})();

</script>
<script>
(() => {
  'use strict';
  const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isTouch = matchMedia('(pointer: coarse)').matches;
  const page = document.getElementById('page');
  requestAnimationFrame(() => page.classList.add('loaded'));

  /* Letter split */
  document.querySelectorAll('[data-split]').forEach(el => {
    const text = el.textContent; el.innerHTML = '';
    [...text].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'letter';
      s.textContent = ch === ' ' ? '\u00A0' : ch;
      s.style.transitionDelay = `${0.15 + i * 0.06}s`;
      el.appendChild(s);
    });
  });

  /* Particles */
  if (!prefersReduced) {
    const c = document.querySelector('.particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div'); p.className = 'particle';
      const size = 1 + Math.random() * 2;
      p.style.cssText = `left:${Math.random()*100}%;bottom:-3%;width:${size}px;height:${size}px;animation-duration:${8+Math.random()*14}s;animation-delay:${Math.random()*10}s;opacity:0;`;
      c.appendChild(p);
    }
  }

  /* Gyroscope */
  if (isTouch && !prefersReduced) {
    const bg = document.querySelector('.bg');
    function handleO(e) {
      const b = Math.max(-30, Math.min(30, e.beta||0)), g = Math.max(-30, Math.min(30, e.gamma||0));
      const tx = (g/30)*-12, ty = (b/60)*-8;
      bg.style.transform = `translate(${tx}px,${ty}px) scale(1.1)`;
    }
    if (typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function') {
      document.addEventListener('touchstart', function req() { DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')window.addEventListener('deviceorientation',handleO,{passive:true})}).catch(()=>{}); document.removeEventListener('touchstart',req); }, {once:true});
    } else if (typeof DeviceOrientationEvent!=='undefined') { window.addEventListener('deviceorientation',handleO,{passive:true}); }
  }

  /* Mouse parallax */
  if (!isTouch && !prefersReduced) {
    const bg = document.querySelector('.bg');
    document.addEventListener('mousemove', e => {
      const lx = (e.clientX/window.innerWidth-0.5)*2, ly = (e.clientY/window.innerHeight-0.5)*2;
      bg.style.transform = `translate(${lx*-10}px,${ly*-8}px) scale(1.1)`;
    });
  }

  /* Custom cursor */
  if (!isTouch) {
    const dot = document.querySelector('.cursor-dot'), ring = document.querySelector('.cursor-ring');
    let mx=-100,my=-100,rx=-100,ry=-100;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; dot.style.left=mx+'px'; dot.style.top=my+'px'; });
    (function loop(){ rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(loop); })();
    document.querySelectorAll('a,[data-magnetic]').forEach(el => {
      el.addEventListener('mouseenter', () => ring.classList.add('hovering'));
      el.addEventListener('mouseleave', () => ring.classList.remove('hovering'));
    });
  }

  /* Magnetic */
  if (!isTouch && !prefersReduced) {
    document.querySelectorAll('[data-magnetic]').forEach(btn => {
      btn.addEventListener('mousemove', e => { const r=btn.getBoundingClientRect(); btn.style.transform=`translate(${(e.clientX-r.left-r.width/2)*0.25}px,${(e.clientY-r.top-r.height/2)*0.25}px)`; });
      btn.addEventListener('mouseleave', () => { btn.style.transform=''; });
    });
  }

  /* Page transition */
})();
</script>
