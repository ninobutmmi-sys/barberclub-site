/* ═══ Voiron — l'accent bleu électrique des visuels du salon ═══
   Il ne sert qu'aux lueurs et aux filets, jamais en aplat. */
:root {
  --vo-accent: #3D5AFE;
  --vo-accent-rgb: 61, 90, 254;
  --vo-glow: rgba(61, 90, 254, 0.45);
  --vo-ink: #AFC0FF;
}
::selection { background: rgba(var(--vo-accent-rgb), 0.35); color: #fff; }

/* Une lumière froide tombe du haut de la page, comme le projecteur de la façade */
.vo-light {
  position: fixed; inset: 0 0 auto 0; height: 70vh; z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(60% 55% at 50% -8%, rgba(var(--vo-accent-rgb), 0.20), transparent 70%),
    radial-gradient(35% 30% at 50% 0%, rgba(var(--vo-accent-rgb), 0.12), transparent 75%);
}

.page-title { text-shadow: 0 0 28px rgba(var(--vo-accent-rgb), 0.35); }
.page-subtitle { color: var(--vo-ink); opacity: 0.75; }
.page-meta { border-color: rgba(var(--vo-accent-rgb), 0.28); }
.page-meta .dot { background: var(--vo-accent); box-shadow: 0 0 8px var(--vo-glow); }

/* Filet bleu au bas de chaque photo, et lueur au survol */
.barber-media-overlay {
  background: linear-gradient(180deg, transparent 48%, rgba(0,0,0,0.82) 100%);
  box-shadow: inset 0 -1px 0 rgba(var(--vo-accent-rgb), 0.55);
}
.barber-card:focus-visible { outline-color: var(--vo-accent); }
.barber-when { color: var(--vo-ink); }
@media (min-width: 768px) {
  .barber-card:hover {
    border-color: rgba(var(--vo-accent-rgb), 0.45);
    box-shadow: 0 18px 50px rgba(0,0,0,0.5), 0 0 34px -10px var(--vo-glow);
  }
  .barber-card:hover .barber-cta {
    background: rgba(var(--vo-accent-rgb), 0.22);
    border-color: rgba(var(--vo-accent-rgb), 0.7);
  }
}

/* Clem : le visage tombe un peu à gauche du cadre */
.barber-media img.vo-clem { object-position: 32% center; }

/* Fauteuil mystère : Jules et Gabriel n'ont pas encore de photo.
   Pas de badge « Prochainement », ils font partie de l'équipe d'ouverture.
   Une lueur bleue les rattache aux visuels du salon. (L'image ne se
   retourne pas : le point d'interrogation est dans la photo.) */
.barber-media picture { display: block; width: 100%; height: 100%; }
.barber-media.vo-mystery::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(80% 60% at 50% 30%, rgba(var(--vo-accent-rgb), 0.22), transparent 70%);
  mix-blend-mode: screen;
}
</style>

<script>
(() => {
  'use strict';
  const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isTouch = matchMedia('(pointer: coarse)').matches;
  const page = document.getElementById('page');
  requestAnimationFrame(() => page.classList.add('loaded'));

  /* Header scroll */
  const header = document.getElementById('header');
  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 50);
  }, { passive: true });

  /* Letter split — mot par mot, sinon le titre se coupe au milieu d'un mot :
     chaque lettre etant un inline-block, le navigateur retourne a la ligne
     n'importe ou. */
  document.querySelectorAll('[data-split]').forEach(el => {
    const words = el.textContent.split(' ');
    el.innerHTML = '';
    let i = 0;
    words.forEach((word, w) => {
      const wrap = document.createElement('span');
      wrap.className = 'word';
      [...word].forEach(ch => {
        const s = document.createElement('span');
        s.className = 'letter';
        s.textContent = ch;
        s.style.transitionDelay = `${0.15 + i * 0.06}s`;
        i++;
        wrap.appendChild(s);
      });
      el.appendChild(wrap);
      if (w < words.length - 1) {
        const space = document.createElement('span');
        space.className = 'letter';
        space.textContent = '\u00A0';
        space.style.transitionDelay = `${0.15 + i * 0.06}s`;
        i++;
        el.appendChild(space);
      }
    });
  });

  /* 3D tilt on cards (desktop) */
  if (!isTouch && !prefersReduced) {
    document.querySelectorAll('[data-tilt]').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        card.style.transform = `perspective(800px) rotateX(${(0.5-y)*8}deg) rotateY(${(x-0.5)*8}deg) translateY(-4px)`;
      });
      card.addEventListener('mouseleave', () => { card.style.transform = ''; });
    });
  }

  /* Custom cursor */
  if (!isTouch) {
    const dot = document.querySelector('.cursor-dot'), ring = document.querySelector('.cursor-ring');
    let mx=-100,my=-100,rx=-100,ry=-100;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; dot.style.left=mx+'px'; dot.style.top=my+'px'; });
    (function loop(){ rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(loop); })();
    document.querySelectorAll('a,[data-tilt]').forEach(el => {
      el.addEventListener('mouseenter', () => ring.classList.add('hovering'));
      el.addEventListener('mouseleave', () => ring.classList.remove('hovering'));
    });
  }
})();
</script>
