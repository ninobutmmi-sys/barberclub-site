name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run unit tests
        run: cd backend && npm run test:unit
        env:
          NODE_ENV: test
          # src/config/env.js fait process.exit(1) si ces trois variables manquent.
          # Certains tests unitaires chargent des routes qui require() ce module,
          # ce qui faisait échouer la CI alors qu'elle passait en local (grâce au
          # backend/.env). Valeurs bidon : aucun test unitaire n'ouvre de connexion
          # ni ne signe de vrai jeton, tout est mocké (tests/unit/helpers/).
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-dummy-jwt-secret-not-used-by-unit-tests
          JWT_REFRESH_SECRET: ci-dummy-refresh-secret-not-used-by-unit-tests

      - name: Build dashboard
        # --legacy-peer-deps : eslint-plugin-react plafonne son peer eslint à ^9.7
        # et 7.37.5 est sa dernière version publiée, alors que le dashboard est en
        # eslint ^10. Sans ce flag, npm ci refuse d'installer. Ça ne concerne que
        # l'outillage de lint — le build Vite et le code livré n'y touchent pas.
        run: cd dashboard && npm ci --legacy-peer-deps && npm run build
